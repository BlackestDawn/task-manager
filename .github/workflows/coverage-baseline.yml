name: Update coverage baseline

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  update-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build common
        run: bun run build:common

      - name: Run tests with coverage
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/taskmanager
          PLATFORM: prod
          JWT_SECRET: ci-test-secret
        run: bun run test:coverage

      - name: Extract baseline
        run: bun run scripts/extract-coverage-baseline.ts

      - name: Commit updated baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- coverage-baseline.json; then
            echo "Baseline unchanged, nothing to commit."
            exit 0
          fi
          git add coverage-baseline.json
          git commit -m "chore: update coverage baseline [skip ci]"
          git push
