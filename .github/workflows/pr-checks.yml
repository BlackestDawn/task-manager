name: PR pre-checks

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code
        run: bun run lint

      - name: Check build
        run: bun run build

      - name: Run unit tests
        env:
          # Dummy values so the backend's config.ts (envOrThrow at module
          # scope) can load — these tests don't touch a real database.
          DB_URL: postgresql://postgres:postgres@localhost:5432/taskmanager
          PLATFORM: prod
          JWT_SECRET: ci-test-secret
        run: bun run test

  # TODO: docker-smoke-test job (build + run both service images against a
  # Postgres service container, hit /health) once the two-service Docker
  # setup here is worth automating that way — see urlshortener's
  # docker-smoke-test job for the shape.

  # TODO: coverage job, once there's a coverage tool/threshold decided for
  # the Bun/Vitest side — see urlshortener's coverage job + coverage-baseline.yml
  # for the shape (diff-against-main-branch-baseline pattern).
