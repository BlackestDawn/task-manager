name: PR pre-checks

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code
        run: bun run lint

      - name: Check build
        run: bun run build

      - name: Run unit tests
        env:
          # Dummy values so the backend's config.ts (envOrThrow at module
          # scope) can load — these tests don't touch a real database.
          DB_URL: postgresql://postgres:postgres@localhost:5432/taskmanager
          PLATFORM: prod
          JWT_SECRET: ci-test-secret
        run: bun run test

  integration-tests:
    runs-on: ubuntu-latest
    # DB query builder tests (packages/backend/src/db/queries/*.integration.test.ts)
    # against a real Postgres — see vitest.integration.config.ts. Locally
    # this same suite runs via `bun run test:integration`, which manages its
    # own disposable container instead of relying on a GitHub-managed
    # service container.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/taskmanager_test
        run: bunx vitest run --config vitest.integration.config.ts

  e2e-tests:
    runs-on: ubuntu-latest
    # Full Playwright E2E suite against production builds of both services —
    # see scripts/run-e2e-tests.sh, which this job runs as-is. That script
    # owns its own disposable Postgres container (Docker is preinstalled on
    # this runner), the same way it does locally via `bun run test:e2e`.
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # TODO: docker-smoke-test job (build + run both service images against a
  # Postgres service container, hit /health) once the two-service Docker
  # setup here is worth automating that way — see urlshortener's
  # docker-smoke-test job for the shape.

  # TODO: coverage job, once there's a coverage tool/threshold decided for
  # the Bun/Vitest side — see urlshortener's coverage job + coverage-baseline.yml
  # for the shape (diff-against-main-branch-baseline pattern).
