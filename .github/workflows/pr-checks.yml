name: PR pre-checks

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code
        run: bun run lint

      - name: Check build
        run: bun run build

      # TODO: re-enable once packages/common/src/permissions/types.ts's
      # z.enum(groupRoleList) load-order bug is fixed (5 of 8 test files
      # currently fail to even load — see the 105-passing/5-erroring split
      # from `bun run test` locally) and CI env vars (DB_URL, PLATFORM,
      # JWT_SECRET) are wired in for the backend's config.ts.
      # - name: Run unit tests
      #   run: bun run test

  # TODO: docker-smoke-test job (build + run both service images against a
  # Postgres service container, hit /health) once the two-service Docker
  # setup here is worth automating that way — see urlshortener's
  # docker-smoke-test job for the shape.

  # TODO: coverage job, once there's a coverage tool/threshold decided for
  # the Bun/Vitest side — see urlshortener's coverage job + coverage-baseline.yml
  # for the shape (diff-against-main-branch-baseline pattern).
